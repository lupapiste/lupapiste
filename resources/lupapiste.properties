# Disable namespace auto reload by default.
# Override in user.properties to "dev" if you want.
noir.mode   prod

jetty.max-threads 250

feature.log-json false

reactivate-application-guard-date 1.1.2025

# 500 MB
bim.viewer-max-filesize 524288000

# The earliest application created or submitted date, when the
# designer consent fields should be available.
consent.start-date 15.10.2025

# Selmer template string for dmcity url that opens application in
# dmcity. The server and vault tags are resolved from the organization
# dmcity configuration.
dmcity.link-format {{server}}/link/{{vault}}/search?ot=101&action=show&pv=1784/T{{application-id}}
