 <script type="text/x-jquery-tmpl" class="ko-template" id="application-bulletins-list-template">
      <!-- ko if: gotResults -->
      <table id="application-bulletins-list">
        <thead>
        <tr data-bind="foreach: columns">
          <th data-bind="css: $data.css, attr: $data.attr">
            <!-- ko if: $data.clickFn -->
            <button class="tertiary" data-bind="click: $data.clickFn">
              <span data-bind="ltext: $data.ltext"></span>
              <i class="lupicon-chevron-small-up" data-bind="visible: $data.isAscending"></i>
              <i class="lupicon-chevron-small-down" data-bind="visible: $data.isDescending"></i>
            </button>
            <!-- /ko -->
            <!-- ko ifnot: $data.clickFn -->
            <span data-bind="ltext: $data.ltext"></span>
            <!-- /ko -->
          </th>
        </tr>
        </thead>
        <tbody data-bind="foreach: bulletins">
          <tr data-bind="click: $component.openBulletin, event: {keyup: $component.onRowKeyup}" tabindex="0">
            <td data-bind="ltext: $data.bulletinProcess"></td>
            <td data-bind="ltext: $data.bulletinStateLoc"></td>
            <td data-bind="ltext: $data.municipality"></td>
            <td data-bind="text: $data.address"></td>
            <td data-bind="text: $data.type"></td>
            <td data-bind="dateString: $data.date"></td>
            <td>
              <!-- <div data-bind="text: $data.commentingType"></div> waiting for feedback -->
              <div data-bind="text: $data.commentingEndsAt"></div>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- /ko -->
      <!-- ko ifnot: gotResults -->
      <p data-bind="ltext: 'bulletin.search.no-results'"></p>
      <!-- /ko -->
</script>
