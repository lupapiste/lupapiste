<!DOCTYPE html>
<html>
  <head>

    <meta charset="utf-8" />

    <meta name="viewport"     content="width=device-width, initial-scale=1.0" />
    <meta name="description"  content="Lupapiste" />
    <meta name="author"       content="Cloudpermit Oy -- https://cloudpermit.com/" />

    <!-- Cloak content until css is loaded -->
    <style type="text/css">@layer legacy {.page{display:none}}</style>
    <link id="fonts-css" href="/lp-static/css/fonts.css" rel="stylesheet"></link>
    <link id="lupicons-css" href="/lp-static/css/lupicons.css" rel="stylesheet"></link>
    <link class="release-css" href="/lp-static/css/main.css" rel="stylesheet"></link>
    <link class="release-css" href="/lp-static/css/quill.css" rel="stylesheet"></link>
    <link class="release-css" href="/lp-static/css/quill.snow.css" rel="stylesheet"></link>
    <link class="release-css" href="/lp-static/css/tailwind.css" rel="stylesheet"></link>
    <link href="inject" rel="stylesheet"></link>

    <link rel="icon" href="/lp-static/img/favicon-v2.png" type="image/png" media="(prefers-color-scheme: light)"/>
    <link rel="icon" href="/lp-static/img/favicon-v2-white.png" type="image/png" media="(prefers-color-scheme: dark)"/>
    <link rel="shortcut icon" href="/lp-static/img/favicon-v2.ico"/>
    <link rel="apple-touch-icon" href="/lp-static/img/apple-touch-icon.png" />

    <meta name="msapplication-config" content="none"/>

    <title>Lupapiste</title>

  </head>

  <body>
    <!-- rootVMO -->
    <div id="app">
      <div id="modal-dialog" data-bind="component: {name: 'modal-dialog'}"></div>
      <div id="indicator" data-bind="component: 'indicator'"></div>
      <div id="indicator-icon" data-bind="component: 'indicator-icon'"></div>
      <div data-bind="component: 'side-panel'"></div>
    </div>

    <script src="/lp-static/lib/jquery-3.7.1.min.js"></script>
    <script src="/lp-static/lib/jquery-migrate-3.5.0.min.js"></script>
    <script src="/lp-static/lib/jquery-ui-1.14.1.min.js"></script>
    <script async src="/lp-static/lib/jquery.dataTables-1.13.11.min.js"></script>

     <script src="inject-common" type="text/javascript"></script>
     <script src="inject-app" type="text/javascript"></script>

    <nav class="nav-wrapper"></nav>
    <div class="notification"></div>

    <section></section>
    <div id="newApp"></div>

    <footer></footer>

    <div class="ko-templates"></div>

    <!--[if lt IE 9]><script src="/lp-static/lib/borderless-iframes.js"></script><![endif]-->
    <script type="text/x-jquery-tmpl" id="error-template">
      <span class="error-message" data-bind="validationMessage: field"></span>
    </script>
    <script src="inject-cljs" type="text/javascript"></script>
    <script src="inject-chatbot"></script>
  </body>
