<script type="text/x-jquery-tmpl" class="ko-template"
        id="password-field-template">
  <div class="field--vertical">
    <label class="lux field--block"
           data-bind="text: label,
                      attr: {'for': id},
                      css: {'required': required}"></label>
    <!-- ko ifnot: showPassword -->
    <input type="password"
           class="lux field--block"
           data-bind="textInput: value,
                      disable: disable,
                      attr: {placeholder: placeholder,
                      id: id,
                      'aria-errormessage': errorId,
                      name: name, maxlength: maxlength,
                      autocomplete: autocomplete},
                      required: required,
                      ariaInvalid: notValid,
                      disable: disable,
                      class: inputClasses,
                      testId: id" />
    <!-- /ko -->
    <!-- ko if: showPassword -->
    <input type="text"
           class="lux field--block"
           data-bind="textInput: value,
                      disable: disable,
                      attr: {placeholder: placeholder,
                      id: id,
                      'aria-errormessage': errorId,
                      name: name, maxlength: maxlength,
                      autocomplete: 'off'},
                      required: required,
                      ariaInvalid: notValid,
                      disable: disable,
                      class: inputClasses,
                      testId: id" />
    <!-- /ko -->
  </div>
  <!-- ko ifnot: notValid -->
  <span class="info-message field--block"
        data-bind="visible: qualityInfo,
                   text: qualityInfo,
                   class: quality">
  </span>
  <!-- /ko -->
  <!-- ko if: notValid -->
  <div class="error-note field--block"
       role="alert"
       data-bind="id: errorId,
                  validationMessage: value">
  </div>
  <!-- /ko -->

</script>
