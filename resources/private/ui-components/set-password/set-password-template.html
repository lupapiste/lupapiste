<script class="ko-template" type="text/x-jquery-tmpl"
        id="set-password-template">
  <div class="form-grid form-grid--no-border">
    <div class="row">
      <div class="col-1">
        <form-cell params="value: password1,
                           attr: {type: showPasswords() ? 'text' : 'password'},
                           cell: 'text',
                           required: true,
                           immediate: true,
                           message: qualityMessage,
                           warning: qualityWarning,
                           label: 'setpw.password.1',
                           testId: 'password1'"></form-cell>
      </div>
      <div class="col-1">
        <form-cell params="value: password2,
                           attr: {type: showPasswords() ? 'text' : 'password'},
                           cell: 'text',
                           required: true,
                           immediate: true,
                           warning: matchWarning,
                           label: 'setpw.password.2',
                           testId: 'password2'"></form-cell>
      </div>
      </div>
      <div class="row">
        <input type="checkbox"
               id="showPasswordsCheckbox"
               data-bind="checked: showPasswords" />
        <label for="showPasswordsCheckbox"
               data-bind="ltext: 'a11y.show-passwords'"></label>
      </div>
  </div>
</script>
